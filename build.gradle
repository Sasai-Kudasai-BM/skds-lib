plugins {
	id "java"
	id 'io.freefair.lombok' version '9.8.2'
}
var lmb = "org.projectlombok:lombok:1.18.48"

version = "1.0"
group = "net.skds"

sourceSets {
	main {
		java.srcDir 'src'
		resources.srcDir 'resources'
	}
	test {
		java.srcDir 'test_src'
		resources.srcDir 'test_resources'
	}
}
repositories {
	mavenCentral()
}
dependencies {
	//compileOnly lmb
	//annotationProcessor lmb
	//testCompileOnly lmb
	//testAnnotationProcessor lmb
	testImplementation("it.unimi.dsi:fastutil:8.5.6")
}

// Valhalla
java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

